[project]
name = "ragnarok"
version = "1.0.0"
description = "Local RAG search over Obsidian vaults: SQLite (sqlite-vec + FTS5), Ollama embeddings, FastMCP server"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
dependencies = [
    "sqlite-vec==0.1.9",
    "python-frontmatter>=1.1",
    "mcp>=1.10",
    "numpy>=2.0",
]

[project.scripts]
ragnarok = "ragnarok.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragnarok"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
