[project]
name = "ragnarok-mcp"
version = "2.1.1"
description = "Local RAG search over Obsidian vaults: SQLite (sqlite-vec + FTS5), Ollama embeddings, FastMCP server"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
dependencies = [
    "sqlite-vec==0.1.9",
    "python-frontmatter>=1.1",
    "mcp>=1.10",
    "numpy>=2.0",
]

keywords = ["mcp", "obsidian", "rag", "claude-code", "sqlite-vec", "ollama"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Topic :: Text Processing :: Indexing",
]

[project.urls]
Homepage = "https://github.com/freyr/ragnarok-bundle"
Changelog = "https://github.com/freyr/ragnarok-bundle/blob/main/CHANGELOG.md"
Issues = "https://github.com/freyr/ragnarok-bundle/issues"

[project.scripts]
ragnarok = "ragnarok.cli:main"
ragnarok-mcp = "ragnarok.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragnarok"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "PT", "C4"]

[tool.ruff.lint.per-file-ignores]
# pytest uses assert; the tests also hold fake paths such as /tmp/v that are never opened.
"tests/**" = ["S101", "S108"]
# The SQL joins constant fragments and `?` placeholders; every value is a bound parameter.
"src/ragnarok/{index,search,tools}.py" = ["S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# a local test calls claude -p or reads the local deny list; CI skips it, `uv run pytest -m local` runs it
markers = ["local: needs claude -p or the deny list of this computer"]
addopts = "-m 'not local'"

[tool.mypy]
files = ["src"]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
# sqlite-vec ships no type information.
module = ["sqlite_vec"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["ragnarok"]

[tool.coverage.report]
# The line coverage of the tests, rounded down. Raise it when the coverage grows.
fail_under = 85
