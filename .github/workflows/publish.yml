name: publish

# Publishes the MCP server. release.yml pushes the tag server-v<version> when a merged PR changes the server
# version. This workflow then checks the versions, builds the package, publishes it to PyPI (trusted
# publishing, environment "pypi") and then publishes server.json to the MCP Registry. ci.yml runs the checks.

on:
  push:
    tags: ["server-v*"]

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Check the versions
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          package=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          server=$(jq -r .version server.json)
          server_package=$(jq -r '.packages[0].version' server.json)
          echo "pyproject.toml $package, server.json $server and $server_package"
          if [ "$server" != "$package" ] || [ "$server_package" != "$package" ]; then
            echo "::error::the versions in pyproject.toml and server.json differ"
            exit 1
          fi
          if [ "$REF_NAME" != "server-v$package" ]; then
            echo "::error::the tag $REF_NAME is not server-v$package"
            exit 1
          fi
          grep -q '<!-- mcp-name: io.github.freyr/ragnarok -->' README.md
      - name: Build
        run: uv build
      - name: Check the wheel holds the config template
        run: unzip -l dist/*.whl | grep -q 'ragnarok/config.example.toml'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ragnarok-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # a release that was uploaded by hand still goes on to the MCP Registry
          skip-existing: true

  registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Install mcp-publisher
        run: |
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Wait for the package on PyPI
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          for _ in $(seq 30); do
            if curl -fsS "https://pypi.org/pypi/ragnarok-mcp/${REF_NAME#server-v}/json" >/dev/null; then exit 0; fi
            sleep 10
          done
          echo "::error::ragnarok-mcp ${REF_NAME#server-v} is not on PyPI after 5 minutes"
          exit 1
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
