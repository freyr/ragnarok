name: CI

# All checks of the MCP server and the Claude Code plugins. The one required check is `ci-gate`.
# Publishing is in publish.yml (tags server-v*); tags come from release.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Claude Code CLI holds the source-of-truth schema for plugins and marketplaces.
  CLAUDE_CODE_VERSION: "2.1.318"

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: pytest
        run: uv run --frozen pytest -q

  build:
    name: Build (wheel and sdist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Build
        run: uv build
      - name: Check the wheel holds the config template
        run: unzip -l dist/*.whl | grep -q 'ragnarok/config.example.toml'
      - name: Check the MCP Registry name in the README
        run: |
          grep -q '<!-- mcp-name: io.github.freyr/ragnarok -->' README.md

  marketplace:
    name: Marketplace (Anthropic validate-plugins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: anthropics/claude-plugins-community/.github/actions/validate-plugins@06ec7b6a0a82bdc4bec44bd82d4368c42f20d7c1 # main 2026-10-13
        with:
          marketplace-path: .claude-plugin/marketplace.json
          claude-cli-version: ${{ env.CLAUDE_CODE_VERSION }}

  plugins:
    name: Plugins (strict validate, versions, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Claude Code
        # The exact version is pinned in CLAUDE_CODE_VERSION; there is no lockfile for a global CLI.
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" # zizmor: ignore[adhoc-packages]
      - name: Validate plugins
        env:
          DISABLE_AUTOUPDATER: "1"
        run: scripts/validate-plugins.sh

  lint:
    name: Lint (ruff, Markdown, shell, workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: ruff check
        run: uv run --frozen ruff check .
      - name: ruff format
        run: uv run --frozen ruff format --check .
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            plugins/**/*.md
            templates/**/*.md
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: .
          ignore_paths: src tests
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  security:
    name: Security (secrets, workflow analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        # The gitleaks action needs a paid license on an organization repository, so run the CLI.
        # The version and the SHA-256 of the archive are pinned; .gitleaks.toml holds the allowlist.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar xzf "$archive" gitleaks
          ./gitleaks git --redact --no-banner --verbose .
      - name: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          # Pin zizmor itself, so a new audit cannot fail CI without a change in this repository.
          version: 1.31.1

  ci-gate:
    # The one required check. It fails when a needed job failed or was cancelled.
    if: always()
    needs: [test, build, marketplace, plugins, lint, security]
    runs-on: ubuntu-latest
    steps:
      - uses: freyr/.github/actions/ci-gate@FREYR_SHA # v1.0.0
        with:
          results: ${{ join(needs.*.result, ' ') }}
