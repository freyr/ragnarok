# ragnarok configuration. `ragnarok init` copies this file to config.toml and sets root and vaults.
# A relative path is relative to the folder of this file.

# The folder that holds the vault folders, and the vault folders to index.
root = "~/Documents/Vaults"
vaults = ["Notes"]

# Notes under these patterns are private: the server never returns them unless allow_private is true.
# Example: private_patterns = ["Notes/Journal/**", "Notes/Finance/**"]
private_patterns = []
allow_private = false

# The index, the backfill backups, the backfill proposals and the evaluation data.
data_dir = "data"

ollama_url = "http://127.0.0.1:11434"
model = "embeddinggemma-2:270m"
dimension = 768

# The splitter joins sections with fewer words than min_words and cuts sections with more than max_words.
min_words = 80
max_words = 300

# A folder that holds one of these files is a project folder.
project_markers = ["DRIVERS.md", "SUMMARY.md"]
# Notes in a folder with this name get status archived.
archive_folder = "_archive"
# Ticket prefixes: the ABC of ABC-123. find_by_jira finds only keys with these prefixes.
jira_prefixes = []
# Notes that the evaluation ignores, for example notes that quote the questions. Path prefixes, not globs.
# Example: eval_exclude = ["Notes/Meta/search-eval"]
eval_exclude = []
# The agent evaluation compares the agent of this checkout with an agent of a baseline checkout that runs on its
# own home. Absolute paths. With both empty, the evaluation has no baseline agent.
# Example: baseline_checkout = "/path/to/ragnarok-baseline"
baseline_checkout = ""
baseline_home = ""

# Put every key above this line: a key below a [vault_paths] or [vault_rules.<vault>] header belongs to that table.

# The folder of a vault that is not in root. A vault with no entry is the folder root/<vault>.
# The vault name stays the first part of the note paths, for example "kb/Runbooks/failover.md".
#
# [vault_paths]
# kb = "~/code/kb"

# Path rules of one vault, for notes without a project or area in their frontmatter.
# Without a table, a vault uses these defaults:
#
# [vault_rules.Notes]
# area = "folder"            # the first folder, in lower case; any other value is the area of all notes
# area_default = ""          # the area at the top of the vault; empty: the vault name in lower case
# project_depth = 2          # the folder level that names the project when no folder has a project marker
# project_fallback = true    # with fewer folders, the first folder names the project; false: "none"
# project_parents = []       # folder paths whose child folders are projects, for example "Clients/Projects"
# ignore_folders = []        # first-level folders that give no area and no project, for example "docs"
# jira_prefixes = []         # ticket prefixes found only in this vault

# The knowledge base. A list table (kinds, doc_types, relation_types, attributes) replaces its default list.
# An unknown key fails. The values below are the defaults.
[kb]
# At or below this count of eligible units the search scans all vectors exactly.
exact_limit = 25000
# Put the entity documents of the query subjects (the `subject` entities, then the aliases in the query text)
# before the ranked results, at most 3.
entity_first = true

# The closed list of entity kinds, each with its standard.
[kb.kinds]
domain = "backstage"
system = "backstage"
component = "backstage"
resource = "backstage"
api = "backstage"
group = "backstage"
person = "backstage"
client = "local"
environment = "local"
vendor = "local"
feature = "local"
process = "local"

# The closed list of document types. class (the default kind of the type): state, proposal, record or none; the
# frontmatter key `class` replaces it for one note. one_per: subject+task, subject, entity, project
# or none. Optional: required_sections (list), review_months (number), standard.
[kb.doc_types]
how-to = {class = "state", one_per = "subject+task", standard = "Diataxis"}
tutorial = {class = "state", one_per = "subject+task", standard = "Diataxis"}
reference = {class = "state", one_per = "subject+task", standard = "Diataxis"}
explanation = {class = "state", one_per = "subject+task", standard = "Diataxis"}
entity = {class = "state", one_per = "entity", standard = "Backstage entity descriptor"}
drivers = {class = "state", one_per = "project", standard = "local"}
summary = {class = "state", one_per = "project", standard = "local"}
spec = {class = "proposal", one_per = "none", standard = "local"}
plan = {class = "proposal", one_per = "none", standard = "local"}
brainstorm = {class = "proposal", one_per = "none", standard = "local"}
decision = {class = "record", one_per = "none", standard = "MADR"}
incident = {class = "record", one_per = "none", standard = "KCS"}
research = {class = "record", one_per = "none", standard = "local"}
measurement = {class = "record", one_per = "none", standard = "local"}
meeting = {class = "record", one_per = "none", standard = "local"}
review = {class = "record", one_per = "none", standard = "local"}
log = {class = "record", one_per = "none", standard = "local"}
guide = {class = "state", one_per = "none", standard = "legacy"}
note = {class = "none", one_per = "none", standard = "legacy"}
template = {class = "none", one_per = "none", standard = "legacy"}

# The closed list of relation types. An empty list of kinds allows every kind.
# "doc" in src_kinds lets a document node be the source.
[kb.relation_types]
partOf = {src_kinds = [], dst_kinds = [], inverse = "hasPart", standard = "backstage"}
dependsOn = {src_kinds = [], dst_kinds = [], inverse = "dependencyOf", standard = "backstage"}
providesApi = {src_kinds = [], dst_kinds = [], inverse = "apiProvidedBy", standard = "backstage"}
consumesApi = {src_kinds = [], dst_kinds = [], inverse = "apiConsumedBy", standard = "backstage"}
requests = {src_kinds = ["doc", "client"], dst_kinds = ["feature"], inverse = "requestedBy", standard = "local"}
memberOf = {src_kinds = ["person"], dst_kinds = ["group"], inverse = "hasMember", standard = "local"}
# The links of a note (the frontmatter keys of the same name) to a note or an entity.
implemented_in = {src_kinds = ["doc"], dst_kinds = [], inverse = "implements", standard = "local"}
followed_by = {src_kinds = ["doc"], dst_kinds = [], inverse = "follows", standard = "local"}

# The attributes of a kind: [kb.attributes.<kind>.<name>]. There are none by default. Example with placeholder names.
# value_type is a free label. A live attribute holds no value: it names the system of record and the skill.
#
# [kb.attributes.environment.region]
# value_type = "string"
# live = false
# scoped = false
#
# [kb.attributes.environment.monthly_cost]
# value_type = "number"
# live = true
# system = "billing-system"
# skill = "billing-read"

# The factors that multiply the RRF score of a document in the rank stage.
[kb.authority]
canonical = 1.5           # the canonical document of a subject in the query
review_overdue = 0.8      # a state document with review_by in the past
archived = 0.5
superseded = 0.5          # a record with superseded_by
duplicate_identity = 0.5  # the second document of one identity key
subject_from_text = false # also take the entities whose alias is a phrase of the query text as subjects

# Each call appends a trace line; files older than retention_days are removed.
[trace]
retention_days = 90

# The admission evaluator.
[w0]
summary_chars = 2000      # the length of the step summary that `ragnarok w0 score` stores
# a step that touches a path with one of these prefixes keeps only the hash of its summary; a prefix is
# absolute, starts with ~, or is relative to root, for example ["Notes/Journal"]
private_paths = []
cost_ratio = 10           # a false reject costs this many false admits
band = [0.03, 0.30]       # the uncertain band of the score
